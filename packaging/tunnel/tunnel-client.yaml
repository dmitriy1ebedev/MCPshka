config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  listen_addr: "127.0.0.1:8768"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  server_urls:
    - channel: main
      url: "http://127.0.0.1:8765/mcp"
  extra_headers:
    Authorization: "file:/etc/mcpshka/mcp-auth-header"
  discovery_extra_headers:
    Authorization: "file:/etc/mcpshka/mcp-auth-header"
  startup_wait_timeout: 30s
  connection_max_ttl: 10m
  max_concurrent_requests: 4
