name: MCPshka GitVerse snapshot contracts

on:
  workflow_dispatch:
  push:
    branches:
      - 'mcpshka-snapshots/**'

jobs:
  snapshot-contracts:
    if: startsWith(gitverse.ref, 'refs/heads/mcpshka-snapshots/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout snapshot tree
        uses: actions/checkout@v4
      - name: Setup pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify immutable source identity
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD^{tree}
          python3 packaging/cloud/source_digest.py --repo .
      - name: Bounded independent host and policy regression
        run: go test -p 1 -count=1 ./internal/systeminfo ./internal/policy
      - name: Offline GitVerse and CI contracts
        run: |
          python3 -B -m unittest discover -s packaging/gitverse -p 'test_*.py'
          python3 -B -m unittest discover -s packaging/moshub -p 'test_*.py'
          python3 -B -m unittest discover -s packaging/ci -p 'test_*.py'
          git diff --check

  # Full release suite on the exact snapshot tree, split into three shards
  # that run side by side (0.9.8): the second CI the MCPshka integration gate
  # accepts (evidence=gitverse). The gate seals the job named release-suite,
  # which succeeds only when every shard did (a failed shard skips it).
  release-shard-0:
    if: startsWith(gitverse.ref, 'refs/heads/mcpshka-snapshots/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout snapshot tree
        uses: actions/checkout@v4
      - name: Setup pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vet and tests, shard 0 of 3 (unprivileged)
        run: sh packaging/ci/release_shard.sh 0

  release-shard-1:
    if: startsWith(gitverse.ref, 'refs/heads/mcpshka-snapshots/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout snapshot tree
        uses: actions/checkout@v4
      - name: Setup pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vet and tests, shard 1 of 3 (unprivileged)
        run: sh packaging/ci/release_shard.sh 1
      - name: Native release and root-policy contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/mcpshka-python"
          "$RUNNER_TEMP/mcpshka-python/bin/python" -m pip install --disable-pip-version-check -r packaging/native/requirements-cloud.txt
          "$RUNNER_TEMP/mcpshka-python/bin/python" -I -B -m unittest discover -s packaging/native -p 'test_*.py'

  release-shard-2:
    if: startsWith(gitverse.ref, 'refs/heads/mcpshka-snapshots/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout snapshot tree
        uses: actions/checkout@v4
      - name: Setup pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vet and tests, shard 2 of 3 (unprivileged)
        run: sh packaging/ci/release_shard.sh 2
      - name: Linux ARM64 cross-build
        run: python3 packaging/lab/build_matrix.py --arch arm64

  release-suite:
    if: startsWith(gitverse.ref, 'refs/heads/mcpshka-snapshots/')
    needs: [release-shard-0, release-shard-1, release-shard-2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: echo "release-shard-0..2 passed"
