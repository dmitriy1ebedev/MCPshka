name: MosHub offline CI image

# MosHub runners are x86 without Internet egress; the image with Go modules,
# python3 and sqlite3 baked in is built here (x86, Internet) instead of on
# the ARM H96. Never on mcpshka-snapshots/**: snapshot CI verdicts read every
# run on those branches.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # GitVerse workflow_dispatch always runs main's copy of a workflow, even
    # with ref=<branch> (run 1997341, 03.11), so a change to this file is only
    # exercised from main: rebuild on it too (BUG-20261103-3).
    paths:
      - go.sum
      - packaging/moshub/ci-image/**
      - .gitverse/workflows/moshub-ci-image.yml

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Registry token present
        id: gate
        env:
          TOKEN: ${{ secrets.MOSHUB_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MOSHUB_REGISTRY_TOKEN is not set: nothing to push"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.gate.outputs.skip != '1'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Assemble and push
        if: steps.gate.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.MOSHUB_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.MOSHUB_REGISTRY_USER }}
        run: |
          # No RUN step and no user namespaces: GitVerse runners forbid
          # unshare(CLONE_NEWUSER) even for root, so buildah cannot build
          # here (BUG-20261103-2). assemble.sh stacks one layer with crane.
          set -o pipefail
          sudo -n true 2>/dev/null && S=sudo || S=
          $S apt-get update -qq && $S apt-get install -y -qq --no-install-recommends debian-archive-keyring >/dev/null
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          mkdir -p "$HOME/.docker"
          echo "$TOKEN" | "$(go env GOPATH)/bin/crane" auth login registry-hub.mos.ru -u "${REGISTRY_USER:-lda6994}" --password-stdin
          $S env DOCKER_CONFIG="$HOME/.docker" PATH="$(go env GOPATH)/bin:$(dirname "$(command -v go)"):$PATH" \
            packaging/moshub/ci-image/assemble.sh | tee moshub-ci-image.txt
          rm -f "$HOME/.docker/config.json"
          grep -Eq '@sha256:[0-9a-f]{64}$' moshub-ci-image.txt
      - name: Point MosHub CI at the new image
        if: steps.gate.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.MOSHUB_REGISTRY_TOKEN }}
        run: |
          # MCPshka keeps MosHub CI on the image it just built: no hand edit
          # of the project variable (owner 03.11.2026: «сама MCPshka»).
          ref=$(tail -n1 moshub-ci-image.txt)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "PRIVATE-TOKEN: $TOKEN" \
            --data-urlencode "value=$ref" https://hub.mos.ru/api/v4/projects/91385/variables/MOSHUB_CI_IMAGE)
          echo "MOSHUB_CI_IMAGE -> $ref (HTTP $code)"
          [ "$code" = 200 ]
      - name: Pinned image reference
        if: steps.gate.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: moshub-ci-image
          path: moshub-ci-image.txt
