name: MCPshka distributed CI
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      shard:
        description: Shard index
        required: true
      source_commit:
        description: Source commit
        required: true
      source_tree:
        description: Exact source tree
        required: true
      snapshot:
        description: Parentless snapshot SHA
        required: true
      plan_hash:
        description: Deterministic package plan digest
        required: true
permissions:
  contents: read
concurrency:
  group: distributed-${{ github.ref }}-${{ inputs.shard }}
  cancel-in-progress: false
jobs:
  public-shard:
    if: github.event_name == 'push'
    name: distributed-shard
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI_PUBLIC_REF: ${{ github.ref }}
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test the exported shard
        run: sudo env -i "PATH=$PATH" "CI_PUBLIC_REF=$CI_PUBLIC_REF" "CI_RUN_ID=$CI_RUN_ID" sh packaging/ci/distributed_shard.sh github
  shard:
    if: github.event_name == 'workflow_dispatch'
    name: distributed-shard-${{ inputs.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI_SHARD: ${{ inputs.shard }}
      CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
      CI_SOURCE_TREE: ${{ inputs.source_tree }}
      CI_SNAPSHOT: ${{ inputs.snapshot }}
      CI_PLAN_HASH: ${{ inputs.plan_hash }}
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test only the assigned packages
        # sudo resets PATH (secure_path) and drops GITHUB_*/CI_* variables:
        # pass exactly what the shard needs.
        run: >-
          sudo env "PATH=$PATH" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          "CI_SHARD=$CI_SHARD" "CI_SOURCE_COMMIT=$CI_SOURCE_COMMIT"
          "CI_SOURCE_TREE=$CI_SOURCE_TREE" "CI_SNAPSHOT=$CI_SNAPSHOT"
          "CI_PLAN_HASH=$CI_PLAN_HASH" "CI_RUN_ID=$CI_RUN_ID"
          sh packaging/ci/distributed_shard.sh github
