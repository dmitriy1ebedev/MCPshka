# Open core CI (overlay from packaging/opencore/public): every push to the
# public main runs vet and the full Go suite as an unprivileged user.
name: Open core CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tini
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tini
      - name: Go vet and tests (unprivileged)
        run: |
          sudo id ci >/dev/null 2>&1 || sudo useradd --create-home --uid 10001 ci
          sudo chown -R ci:ci .
          gobin="$(dirname "$(command -v go)")"
          sudo runuser -u ci -- env -i PATH="$gobin:/usr/bin:/bin" HOME=/home/ci LANG=C GOTOOLCHAIN="${GOTOOLCHAIN:-auto}" GOFLAGS=-mod=readonly go vet ./...
          sudo runuser -u ci -- env -i PATH="$gobin:/usr/bin:/bin" HOME=/home/ci LANG=C GOTOOLCHAIN="${GOTOOLCHAIN:-auto}" GOFLAGS=-mod=readonly /usr/bin/tini -s -g -- go test -p 2 -count=1 ./...
